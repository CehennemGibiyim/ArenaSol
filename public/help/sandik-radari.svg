  <!-- explainer -->
  <rect x="40" y="418" width="600" height="262" rx="14" fill="url(#card2)" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="60" y="446" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#fff">Oran nedir, sandık açma nasıl çalışır?</text>
  <text x="60" y="470" font-family="Segoe UI,sans-serif" font-size="9" fill="#ffffff" opacity="0.55">Oran = jeton ÷ kontenjan. 500 jeton / 100 kişi = 5. Yüksek oran, kişi başı daha çok jeton demektir.</text>
  <text x="60" y="490" font-family="Segoe UI,sans-serif" font-size="9" fill="#ffffff" opacity="0.55">Windows ajanı sandık açılışından 20 sn önce yayını tarayıcıda açar ve bildirim gönderir.</text>
  <text x="60" y="510" font-family="Segoe UI,sans-serif" font-size="9" fill="#ffffff" opacity="0.55">Jetonu almak için TikTok hesabınla giriş yapıp tek dokunuşla katılman gerekir; sistem senin</text>
  <text x="60" y="530" font-family="Segoe UI,sans-serif" font-size="9" fill="#ffffff" opacity="0.55">hesabına giriş yapmaz, senin yerine talep göndermez (TikTok mobil oturum ister).</text>
  <text x="60" y="562" font-family="Segoe UI,sans-serif" font-size="8.5" letter-spacing="1.4" fill="#f5b642" opacity="0.8">ADIMLAR</text>
  <g font-family="Segoe UI,sans-serif" font-size="9" fill="#ffffff" opacity="0.6">
    <text x="60" y="586">1 · Ayarlar → sandık uyarı oranı eşiğini belirle (ör. 2).</text>
    <text x="60" y="606">2 · Windows paketinde AUTO_JOIN=1 olsun; ajan GitHub verisini 3 sn'de bir yeniler.</text>
    <text x="60" y="626">3 · Telegram/Discord webhook ekle; yüksek oranlı sandık anında bildirilir.</text>
    <text x="60" y="646">4 · Açılan yayında "Toplamaya Katıl"a dokun; jeton cüzdanına düşer.</text>
  </g>

  <rect x="660" y="418" width="580" height="262" rx="14" fill="url(#card2)" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="680" y="446" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#fff">Kapsam ve sınırlar (dürüst rapor)</text>
  <g font-family="Segoe UI,sans-serif" font-size="9" fill="#ffffff" opacity="0.55">
    <text x="680" y="472">• GitHub Actions taraması her 5 dakikada bir çalışır; panel kapalı olsa da veri birikir.</text>
    <text x="680" y="494">• Kaynak: izleme listesi + sabitlenen odalar + Tik.Tools açık listesi (10 yayın).</text>
    <text x="680" y="516">• EULER_API_KEY varsa bölge feed'i ile kapsam genişler; yoksa dünya taraması yapılmaz.</text>
    <text x="680" y="538">• Sandık olayı bazı yayınlarda hiç iletilmez; tespit garantisi yoktur.</text>
    <text x="680" y="560">• Boş liste = veri yok. Panel sahte sandık, sahte jeton veya sahte izleyici üretmez.</text>
    <text x="680" y="582">• Tanımlı olmayan kimlik/jeton/kontenjan için kayıt açılmaz.</text>
  </g>
  <rect x="680" y="606" width="540" height="56" rx="10" fill="#25f4ee" opacity="0.07" stroke="#25f4ee" stroke-opacity="0.18"/>
  <text x="696" y="626" font-family="Segoe UI,sans-serif" font-size="8.5" fill="#9df9f5">7/24 tarama GitHub'da çalışır → Windows paketi aynı veriyi 3 sn'de bir çeker.</text>
  <text x="696" y="644" font-family="Segoe UI,sans-serif" font-size="8.5" fill="#9df9f5">Panel içi rehber: /yardim · Web rehber: docs/yardim.html</text>
</svg>
