name: Collect live rooms + chests (7/24)

on:
  schedule:
    # GitHub'ın izin verdiği en sık aralık: 5 dakika. Kullanıcı sistemde olmasa da çalışır.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/collect.mjs"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install connector
        run: npm install --no-save --no-audit --no-fund tiktok-live-connector@^2.5.0

      - name: Scan and listen
        env:
          EULER_API_KEY: ${{ secrets.EULER_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MAX_ROOMS: ${{ vars.MAX_ROOMS }}
          LISTEN_SECONDS: "50"
        run: node agent/collect.mjs

      - name: Commit data
        run: |
          git config user.name "arena-collector"
          git config user.email "arena-collector@users.noreply.github.com"
          git add docs/data/rooms.json docs/data/chests.json docs/data/status.json
          git diff --cached --quiet && echo "degisiklik yok" || git commit -m "chore(data): live rooms + chests $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin main
          git push
